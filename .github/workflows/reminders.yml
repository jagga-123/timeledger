name: Payment reminders

# Render's free tier sleeps, so the API can't keep its own timer. This workflow is the timer: once an hour it calls
# POST /api/cron/reminders, which sends the reminders that are due today and remembers which ones it has sent.
# Calling it more often than needed is harmless (every reminder is claimed in the database first, so none goes twice).
#
# Setup (once): Settings -> Secrets and variables -> Actions -> New repository secret
#   REMINDERS_URL  the full address, e.g. https://your-api.onrender.com/api/cron/reminders
#   CRON_SECRET    the same value as CRON_SECRET in the backend's environment
on:
  schedule:
    - cron: "17 * * * *" # minute 17 of every hour (not on the hour, when GitHub's scheduler is busiest)
  workflow_dispatch: # the "Run workflow" button: try it by hand

permissions: {}

concurrency:
  group: payment-reminders
  cancel-in-progress: false

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the reminders
        env:
          REMINDERS_URL: ${{ secrets.REMINDERS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$REMINDERS_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the repository secrets REMINDERS_URL and CRON_SECRET (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          # A sleeping Render service needs up to a minute to wake up, so wait long and try again a few times
          curl --fail-with-body --silent --show-error \
            --max-time 180 --retry 3 --retry-delay 30 --retry-all-errors \
            --request POST --header "X-Cron-Secret: $CRON_SECRET" "$REMINDERS_URL"
          echo
